name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev
          pip install buildozer cython
          pip install --upgrade setuptools
      
      - name: Build APK with verbose logs
        run: |
          buildozer android debug --force 2>&1 | tee build.log
          cat build.log | tail -n 100
      
      - name: Rename and prepare APK
        if: success()
        run: |
          mkdir -p release
          cp bin/*.apk release/snake-game.apk
          ls -la release/
      
      - name: Upload APK to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: release/snake-game.apk
          tag_name: Release
          name: "Snake Game v1.0.0"
          body: |
            ## 🐍 Snake Game APK
            
            ### Установка:
            1. Скачайте APK
            2. Разрешите установку из неизвестных источников
            3. Установите и играйте!
            
            ### Управление:
            - Стрелки на экране или клавиши ↑↓←→
            - Пробел — рестарт после игры
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as Artifact (backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snake-app
          path: bin/*.apk
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
