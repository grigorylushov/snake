name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache Android SDK
      uses: actions/cache@v3
      with:
        path: ~/.buildozer/android/platform/android-sdk
        key: android-sdk-${{ runner.os }}-buildozer
    
    - name: Cache Android NDK
      uses: actions/cache@v3
      with:
        path: ~/.buildozer/android/platform/android-ndk-*
        key: android-ndk-${{ runner.os }}-buildozer
    
    - name: Cache python-for-android
      uses: actions/cache@v3
      with:
        path: ~/.buildozer/android/platform/python-for-android
        key: p4a-${{ runner.os }}-buildozer
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev
        pip install buildozer cython
        pip install --upgrade setuptools
    
    - name: Build with Buildozer
      timeout-minutes: 30
      run: |
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: snake-app
        path: bin/*.apk
        retention-days: 30        retention-days: 30
